<script>
(function() {
    // 微信二维码生成
    var wechatWrapper = document.querySelector('.wechat-wrapper');
    var popup = document.getElementById('wechat-qrcode-popup');
    var qrcodeContainer = document.getElementById('wechat-qrcode');
    var qrCreated = false;

    function renderQR() {
        if (qrCreated) return;
        qrCreated = true;
        if (window.QRCode) {
            new QRCode(qrcodeContainer, {
                text: window.location.href,
                width: 128,
                height: 128,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        } else {
            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
            script.onload = function() {
                new QRCode(qrcodeContainer, {
                    text: window.location.href,
                    width: 128,
                    height: 128,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            };
            document.body.appendChild(script);
        }
    }

    if (wechatWrapper) {
        wechatWrapper.addEventListener('mouseenter', renderQR);
        wechatWrapper.addEventListener('click', function(e) {
            renderQR();
            if (popup) popup.classList.toggle('is-active');
        });
        document.addEventListener('click', function(e) {
            if (popup && !wechatWrapper.contains(e.target)) {
                popup.classList.remove('is-active');
            }
        });
    }

    // 复制链接功能
    var copyBtn = document.getElementById('copy-share-link');
    var copyBtnText = document.getElementById('copy-btn-text');
    var copyBtnIcon = document.getElementById('copy-btn-icon');

    if (copyBtn) {
        copyBtn.addEventListener('click', function() {
            var url = window.location.href;
            var copyPromise;

            if (navigator.clipboard && window.isSecureContext) {
                copyPromise = navigator.clipboard.writeText(url);
            } else {
                var textarea = document.createElement('textarea');
                textarea.value = url;
                textarea.style.position = 'fixed';
                textarea.style.left = '-999999px';
                textarea.style.top = '-999999px';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    document.execCommand('copy');
                    copyPromise = Promise.resolve();
                } catch (err) {
                    copyPromise = Promise.reject(err);
                }
                textarea.remove();
            }

            copyPromise.then(function() {
                copyBtn.classList.add('copied');
                if (copyBtnText) copyBtnText.textContent = '已复制！';
                if (copyBtnIcon) copyBtnIcon.className = 'fas fa-check';

                setTimeout(function() {
                    copyBtn.classList.remove('copied');
                    if (copyBtnText) copyBtnText.textContent = '复制链接';
                    if (copyBtnIcon) copyBtnIcon.className = 'fas fa-link';
                }, 2000);
            }).catch(function() {
                prompt('复制链接失败，请手动复制：', url);
            });
        });
    }
})();
</script>

    <script>
      $(document).ready(function () {
        $('figure.hljs').each(function(i, figure) {
          var codeId = 'code-' + i;
          var code = figure.querySelector('.code');
          var copyButton = $('<button>Copy <i class="far fa-clipboard"></i></button>');
          code.id = codeId;
          copyButton.addClass('clipboard-btn');
          copyButton.attr('data-clipboard-target-id', codeId);

          var figcaption = figure.querySelector('figcaption');

          if (figcaption) {
            figcaption.append(copyButton[0]);
          } else {
            figure.prepend(copyButton[0]);
          }
        })

        var clipboard = new ClipboardJS('.clipboard-btn', {
          target: function(trigger) {
            return document.getElementById(trigger.getAttribute('data-clipboard-target-id'));
          }
        });
        clipboard.on('success', function(e) {
          e.clearSelection();
        })
      })
    </script>
